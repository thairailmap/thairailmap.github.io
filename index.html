<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แผนที่รถไฟไทย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: full-bleed schematic map (drawn to true rail distance) with a control rail on the left; bottom sheet on phones. */
:root {
  --paper: #FAFAF7;
  --panel: #FFFFFF;
  --ink: #16191F;
  --muted: #5E6470;
  --rule: #E3E3DC;
  --accent: #1D3E8F;
  --halo: rgba(250,250,247,0.92);
  --font: "IBM Plex Sans Thai", "Noto Sans Thai", "Leelawadee UI", Tahoma, system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12151B; --panel: #1A1E26; --ink: #ECEDEF; --muted: #A2A8B4; --rule: #2C313C;
    --accent: #8FB0FF; --halo: rgba(18,21,27,0.9); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12151B; --panel: #1A1E26; --ink: #ECEDEF; --muted: #A2A8B4; --rule: #2C313C;
  --accent: #8FB0FF; --halo: rgba(18,21,27,0.9); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.45; display: grid; grid-template-columns: 372px 1fr; overflow: hidden; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Panel */
#panel { background: var(--panel); border-right: 1px solid var(--rule); overflow-y: auto; display: flex; flex-direction: column; gap: 18px; padding: 18px 18px 28px; z-index: 3; }
.handle { display: none; }
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.brand { display: flex; gap: 10px; align-items: center; }
.brand svg { flex: none; }
h1 { font-size: 20px; line-height: 1.2; margin: 0; font-weight: 700; text-wrap: balance; letter-spacing: -0.01em; }
.sub { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
.lang { display: flex; border: 1px solid var(--rule); border-radius: 999px; padding: 2px; flex: none; }
.lang button { border: 0; background: transparent; padding: 4px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
section { display: flex; flex-direction: column; }
.field { position: relative; }
.field input { width: 100%; border: 1.5px solid var(--rule); background: var(--paper); border-radius: 10px; padding: 9px 12px 9px 34px; outline: none; }
.field input:focus { border-color: var(--accent); }
.field .ico { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--muted); pointer-events: none; }
.field .pin { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 11px; height: 11px; border-radius: 50%; border: 2.5px solid var(--ink); background: var(--panel); }
.field .pin.to { background: var(--ink); }
.ac { position: absolute; left: 0; right: 0; top: calc(100% + 4px); background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.14); list-style: none; margin: 0; padding: 4px; z-index: 20; max-height: 300px; overflow-y: auto; }
.ac[hidden] { display: none; }
.ac li { display: grid; grid-template-columns: 10px 1fr auto; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 7px; cursor: pointer; }
.ac li.act, .ac li:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.ac small { color: var(--muted); font-size: 11.5px; white-space: nowrap; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.plan { display: grid; grid-template-columns: 1fr 34px; gap: 6px 8px; align-items: center; }
.plan .field { grid-column: 1; }
.swap { grid-column: 2; grid-row: 1 / span 2; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--rule); background: var(--panel); display: grid; place-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { border: 1px solid var(--rule); background: var(--paper); border-radius: 999px; padding: 4px 10px; font-size: 12px; }
.chip:hover { border-color: var(--accent); }
.hint { color: var(--muted); font-size: 12.5px; margin: 8px 0 0; }

/* Result */
.result { margin-top: 12px; border: 1px solid var(--rule); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 12px; background: var(--paper); }
.total { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.total b { font-size: 32px; line-height: 1; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.total span { color: var(--muted); }
.legs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.leg { display: grid; grid-template-columns: 14px 1fr auto; gap: 0 10px; position: relative; padding-bottom: 10px; }
.leg .bar { grid-row: 1 / span 2; width: 6px; border-radius: 3px; margin: 4px auto 0; }
.leg .t { font-weight: 600; }
.leg .m { color: var(--muted); font-size: 12px; grid-column: 2 / span 2; }
.leg .k { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.xfer { font-size: 12px; color: var(--muted); padding: 0 0 10px 24px; }
.result .row { display: flex; gap: 8px; }
.btn { border: 1px solid var(--rule); background: var(--panel); border-radius: 8px; padding: 6px 12px; font-size: 12.5px; font-weight: 600; }
.btn.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.note { font-size: 12px; color: var(--muted); }

/* Lines list */
.lines { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.lines label { display: grid; grid-template-columns: 18px 26px 1fr auto; align-items: center; gap: 8px; padding: 6px 4px; border-radius: 8px; cursor: pointer; }
.lines label:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); }
.lines .sw { height: 6px; border-radius: 3px; }
.lines .nm { font-weight: 600; }
.lines .st { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; text-align: right; }
.lines input, .opts input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
.opts { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.opts label { display: flex; gap: 8px; align-items: center; cursor: pointer; }
.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; font-size: 12.5px; }
.legend div { display: flex; gap: 8px; align-items: center; }
.about { font-size: 12px; color: var(--muted); border-top: 1px solid var(--rule); padding-top: 14px; }
.about p { margin: 0 0 6px; }

/* Map */
#map { position: relative; overflow: hidden; touch-action: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; }
#cv.drag { cursor: grabbing; }
.ctrls { position: absolute; right: 16px; top: 16px; display: flex; flex-direction: column; gap: 6px; z-index: 2; }
.ctrls button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--rule); background: var(--panel); display: grid; place-items: center; font-size: 18px; font-weight: 600; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.ctrls .txt { font-size: 11px; font-weight: 700; }
.scale { position: absolute; left: 16px; bottom: 16px; font-size: 11.5px; color: var(--ink); background: var(--halo); padding: 6px 10px 6px; border-radius: 8px; z-index: 2; display: flex; flex-direction: column; gap: 4px; }
.scale .bar { height: 6px; border: 2px solid var(--ink); border-top: 0; }
.scale small { color: var(--muted); font-size: 10.5px; }

/* Station card */
#card { position: absolute; right: 70px; top: 16px; width: 330px; max-width: calc(100% - 32px); background: var(--panel); border: 1px solid var(--rule); border-radius: 14px; box-shadow: 0 12px 32px rgba(0,0,0,0.16); z-index: 4; padding: 16px; display: flex; flex-direction: column; gap: 10px; max-height: calc(100% - 32px); overflow-y: auto; }
#card[hidden] { display: none; }
#card .hd { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
#card h3 { margin: 0; font-size: 20px; line-height: 1.2; text-wrap: balance; }
#card .alt { color: var(--muted); font-size: 13px; }
#card .x { border: 0; background: transparent; font-size: 20px; line-height: 1; padding: 2px 6px; color: var(--muted); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 11.5px; font-weight: 600; border-radius: 999px; padding: 2px 9px; border: 1.5px solid; }
.tag.plain { border-color: var(--rule); color: var(--muted); }
.big { display: flex; align-items: baseline; gap: 6px; }
.big b { font-size: 26px; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.big span { color: var(--muted); font-size: 12.5px; }
.rt { border-top: 1px solid var(--rule); padding-top: 8px; display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; }
.rt .rn { font-weight: 600; display: flex; gap: 6px; align-items: center; }
.rt .km { color: var(--muted); font-variant-numeric: tabular-nums; }
.nb { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.nb button { text-align: left; border: 1px solid var(--rule); background: var(--paper); border-radius: 8px; padding: 5px 8px; font-size: 12px; line-height: 1.3; }
.nb button:disabled { opacity: 0.4; cursor: default; }
.nb small { display: block; color: var(--muted); font-variant-numeric: tabular-nums; }

@media (max-width: 760px) {
  body { grid-template-columns: 1fr; }
  #map { position: fixed; inset: 0; }
  #panel { position: fixed; left: 0; right: 0; bottom: 0; height: 168px; border-right: 0; border-top: 1px solid var(--rule); border-radius: 18px 18px 0 0; box-shadow: 0 -8px 24px rgba(0,0,0,0.12); padding: 6px 16px 24px; transition: height 0.25s ease; gap: 14px; }
  #panel.open { height: 78%; }
  .handle { display: block; border: 0; background: transparent; padding: 8px 0 2px; width: 100%; flex: none; }
  .handle span { display: block; width: 40px; height: 4px; border-radius: 2px; background: var(--rule); margin: 0 auto; }
  h1 { font-size: 17px; }
  .sub { display: none; }
  #card { left: 16px; right: 16px; width: auto; top: 12px; max-height: calc(100% - 200px); }
  .ctrls { top: auto; bottom: 184px; right: 12px; }
  .scale { bottom: 184px; left: 12px; }
}
@media (prefers-reduced-motion: reduce) { #panel { transition: none; } }
</style>
</head>

const redraw = () => { if (!raf) raf = requestAnimationFrame(draw); };

function updateScale() {
  const target = 110 / cam.z;
  const steps = [0.5, 1, 2, 5, 10, 20, 50, 100, 200, 500];
  const v = steps.reduce((b, s) => s <= target ? s : b, steps[0]);
  document.getElementById('scaleBar').style.width = (v * cam.z) + 'px';
  document.getElementById('scaleTxt').textContent = fmtKm(v).replace(/[.,]0+$/, '') + ' ' + t('km');
}

/* ---------- Camera ---------- */
function resize() {
  const r = mapEl.getBoundingClientRect();
  W = r.width; H = r.height; dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  redraw();
}
function bboxOf(list) { let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity; for (const [x, y] of list) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); } return [x0, y0, x1, y1]; }
function viewport() {
  // visible area not covered by the bottom sheet on phones
  const mobile = window.matchMedia('(max-width: 760px)').matches;
  const bottom = mobile ? document.getElementById('panel').getBoundingClientRect().height : 0;
  return { top: 0, bottom, left: 0, right: 0 };
}
function fitTo(bb, pad = 60, animate = true, maxZ = 40) {
  const vp = viewport();
  const w = Math.max(10, bb[2] - bb[0]), h = Math.max(10, bb[3] - bb[1]);
  const aw = W - pad * 2, ah = H - vp.bottom - pad * 2;
  const z = Math.min(maxZ, Math.max(0.05, Math.min(aw / w, ah / h)));
  const cx = (bb[0] + bb[2]) / 2, cy = (bb[1] + bb[3]) / 2 + (vp.bottom / 2) / z;
  flyTo(cx, cy, z, animate);
}
let anim = null;
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function flyTo(x, y, z, animate = true) {
  if (!animate || reduced) { cam.x = x; cam.y = y; cam.z = z; redraw(); return; }
  const s = { ...cam }, t0 = performance.now(), D = 450;
  cancelAnimationFrame(anim);
  const step = now => {
    const u = Math.min(1, (now - t0) / D), e = 1 - Math.pow(1 - u, 3);
    const lz = Math.log(s.z) + (Math.log(z) - Math.log(s.z)) * e;
    cam.z = Math.exp(lz); cam.x = s.x + (x - s.x) * e; cam.y = s.y + (y - s.y) * e;
    draw();
    if (u < 1) anim = requestAnimationFrame(step);
  };
  anim = requestAnimationFrame(step);
}
function zoomAt(sx, sy, f) {
  const nz = Math.max(fitZ * 0.5, Math.min(60, cam.z * f));
  const [wx, wy] = toW(sx, sy);
  cam.z = nz;
  cam.x = wx - (sx - W / 2) / nz; cam.y = wy - (sy - H / 2) / nz;
  redraw();
}
const allBB = bboxOf(stations.map(s => s.pos));
function fitAll(animate) {
  const vp = viewport();
  fitZ = Math.min((W - 80) / (allBB[2] - allBB[0]), (H - vp.bottom - 80) / (allBB[3] - allBB[1]));
  fitTo(allBB, 70, animate);
}
function fitBkk() { fitTo([-40, -30, 40, 30], 30); }

// pointer
const ptrs = new Map();
let moved = 0, pinch = null;
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.offsetX, e.offsetY]); moved = 0; cv.classList.add('drag');
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), m: [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2] }; }
});
cv.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) { hover(e.offsetX, e.offsetY); return; }
  const p = ptrs.get(e.pointerId), dx = e.offsetX - p[0], dy = e.offsetY - p[1];
  ptrs.set(e.pointerId, [e.offsetX, e.offsetY]);
  if (ptrs.size === 1) { cam.x -= dx / cam.z; cam.y -= dy / cam.z; moved += Math.abs(dx) + Math.abs(dy); redraw(); }
  else if (ptrs.size === 2 && pinch) {
    const [a, b] = [...ptrs.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]), m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    cam.x -= (m[0] - pinch.m[0]) / cam.z; cam.y -= (m[1] - pinch.m[1]) / cam.z;
    zoomAt(m[0], m[1], d / pinch.d); pinch = { d, m }; moved += 10;
  }
});
const up = e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null;
  if (!ptrs.size) { cv.classList.remove('drag'); if (moved < 6 && e.type === 'pointerup') click(e.offsetX, e.offsetY); }
};
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
cv.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.offsetX, e.offsetY, Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0018))); }, { passive: false });
cv.addEventListener('dblclick', e => zoomAt(e.offsetX, e.offsetY, 2));
function inPoly(P, x, y) { let c = false; for (let i = 0, j = P.length - 1; i < P.length; j = i++) { const [xi, yi] = P[i], [xj, yj] = P[j]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c; } return c; }
function hitAt(x, y) {
  let best = null, bd = Infinity;
  for (const h of hits) { const d = Math.hypot(h.x - x, h.y - y); if (d < Math.max(14, h.r + 6) && d < bd) { bd = d; best = h.s; } }
  if (best) return best;
  for (const h of hits) if (h.poly && inPoly(h.poly, x, y)) return h.s;
  return null;
}
function hover(x, y) { cv.style.cursor = hitAt(x, y) ? 'pointer' : ''; }
function click(x, y) { const s = hitAt(x, y); if (s) selectStation(s, false); else if (selected) { selected = null; renderCard(); redraw(); } }
document.getElementById('zin').onclick = () => zoomAt(W / 2, (H - viewport().bottom) / 2, 1.6);
document.getElementById('zout').onclick = () => zoomAt(W / 2, (H - viewport().bottom) / 2, 1 / 1.6);
document.getElementById('fit').onclick = () => fitAll(true);
document.getElementById('bkk').onclick = fitBkk;
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === '+' || e.key === '=') zoomAt(W / 2, H / 2, 1.4);
  if (e.key === '-') zoomAt(W / 2, H / 2, 1 / 1.4);
  if (e.key === 'Escape' && selected) { selected = null; renderCard(); redraw(); }
});

/* ---------- Search / combobox ---------- */
function search(q) {
  q = q.trim().toLowerCase(); if (!q) return [];
  const res = [];
  for (const s of stations) {
    const th = s.th.toLowerCase(), en = s.en.toLowerCase(), pv = (s.prov + ' ' + (PROVINCES[s.prov] || '')).toLowerCase();
    const thCore = th.replace(/^ชุมทาง/, ''), enCore = en.replace(/ jn$/, '');
    let sc = -1;
    if (th === q || en === q) sc = 0; else if (th.startsWith(q) || thCore.startsWith(q) || en.startsWith(q) || enCore.startsWith(q)) sc = 1; else if (th.includes(q) || en.includes(q)) sc = 2; else if (pv.includes(q)) sc = 3;
    if (sc >= 0) res.push([sc, s]);
  }
  return res.sort((a, b) => a[0] - b[0] || a[1].rank - b[1].rank || a[1].th.length - b[1].th.length).map(r => r[1]);
}
function combo(input, onPick) {
  const list = document.createElement('ul'); list.className = 'ac'; list.hidden = true; list.setAttribute('role', 'listbox');
  input.parentNode.appendChild(list);
  input.setAttribute('role', 'combobox'); input.setAttribute('aria-autocomplete', 'list');
  let items = [], act = 0;
  const hide = () => { list.hidden = true; input.setAttribute('aria-expanded', 'false'); };
  const render = () => {
    items = search(input.value).slice(0, 8);
    if (!items.length) return hide();
    list.innerHTML = items.map((s, i) => `<li role="option" data-i="${i}" class="${i === act ? 'act' : ''}"><span class="dot" style="background:${LINES[[...s.lines][0]].color}"></span><span>${esc(nm(s))}</span><small>${esc(provName(s))}</small></li>`).join('');
    list.hidden = false; input.setAttribute('aria-expanded', 'true');
  };
  const pick = s => { input.value = nm(s); hide(); onPick(s); };
  input.addEventListener('input', () => { act = 0; render(); });
  input.addEventListener('focus', () => { if (input.value) { act = 0; render(); } });
  input.addEventListener('keydown', e => {
    if (list.hidden) return;
    if (e.key === 'ArrowDown') { act = Math.min(items.length - 1, act + 1); render(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { act = Math.max(0, act - 1); render(); e.preventDefault(); }
    else if (e.key === 'Enter') { if (items[act]) pick(items[act]); e.preventDefault(); }
    else if (e.key === 'Escape') hide();
  });
  list.addEventListener('mousedown', e => e.preventDefault());
  list.addEventListener('click', e => { const li = e.target.closest('li'); if (li) pick(items[+li.dataset.i]); });
  input.addEventListener('blur', () => setTimeout(hide, 120));
}
const qIn = document.getElementById('q'), fromIn = document.getElementById('from'), toIn = document.getElementById('to');
combo(qIn, s => { selectStation(s, true); qIn.blur(); });
combo(fromIn, s => { planFrom = s; computePlan(true); });
combo(toIn, s => { planTo = s; computePlan(true); });
fromIn.addEventListener('input', () => { if (!fromIn.value) { planFrom = null; computePlan(); } });
toIn.addEventListener('input', () => { if (!toIn.value) { planTo = null; computePlan(); } });
document.getElementById('swap').onclick = () => { [planFrom, planTo] = [planTo, planFrom]; computePlan(true); };

/* ---------- Planner ---------- */
function computePlan(focus) {
  fromIn.value = planFrom ? nm(planFrom) : '';
  toIn.value = planTo ? nm(planTo) : '';
  plan = null;
  if (planFrom && planTo) {
    if (planFrom === planTo) plan = { ok: false, msg: t('same') };
    else {
      const { dist, prev } = dijkstra(planFrom.id);
      if (!isFinite(dist[planTo.id])) plan = { ok: false, msg: t('noPath') };
      else {
        const edges = [];
        for (let v = planTo.id; v !== planFrom.id; v = prev[v].from) edges.unshift(prev[v].e);
        plan = buildPlan(edges);
      }
    }
  }
  renderPlan();
  redraw();
  if (focus && plan && plan.ok) {
    const pts = []; plan.legs.forEach(l => l.parts.forEach(p => pts.push(...p)));
    fitTo(bboxOf(pts), 70);
  }
}
function buildPlan(edges) {
  const legs = []; let ferry = false;
  const stSet = new Set([planFrom.id]), lineOf = new Map(), xfer = new Set();
  let cur = null;
  for (const e of edges) {
    if (e.ferry) { ferry = true; cur = null; stSet.add(e.to); continue; }
    stSet.add(e.to);
    const ls = e.R.lines;
    if (cur && cur.R === e.R) { cur.edges.push(e); }
    else if (cur && cur.lineSet.some(l => ls.includes(l))) { cur.lineSet = cur.lineSet.filter(l => ls.includes(l)); cur.edges.push(e); }
    else { cur = { lineSet: ls.slice(), edges: [e], R: e.R }; legs.push(cur); }
    cur.R = e.R;
  }
  for (const L of legs) {
    L.line = L.lineSet[0];
    L.from = L.edges[0].ea.s; L.to = L.edges[L.edges.length - 1].eb.s;
    L.km = L.edges.reduce((a, e) => a + e.w, 0);
    L.n = L.edges.length;
    // merge consecutive edges on same route into parts
    L.parts = []; let run = null;
    for (const e of L.edges) {
      if (run && run.R === e.R) run.b = e.eb.arc; else { run = { R: e.R, a: e.ea.arc, b: e.eb.arc }; L.parts.push(run); }
      lineOf.set(e.ea.s.id, L.line); lineOf.set(e.eb.s.id, L.line);
    }
    // mid point for distance pill: along the longest part
    const lp = L.parts.reduce((a, p) => Math.abs(p.b - p.a) > Math.abs(a.b - a.a) ? p : a);
    const m = pointAt(lp.R, (lp.a + lp.b) / 2), sg = lp.R.segs[m.si];
    L.mid = { p: m.p, n: [-sg.norm[0], -sg.norm[1]] };
    L.parts = L.parts.map(p => subPath(p.R, p.a, p.b));
  }
  for (let i = 1; i < legs.length; i++) xfer.add(legs[i].from.id);
  return { ok: true, legs, ferry, km: legs.reduce((a, l) => a + l.km, 0), stops: edges.length, stSet, lineOf, xfer };
}
const EXAMPLES = [['กรุงเทพ|กรุงเทพมหานคร', 'เชียงใหม่|เชียงใหม่'], ['กรุงเทพ|กรุงเทพมหานคร', 'สุไหงโก-ลก|นราธิวาส'], ['ขอนแก่น|ขอนแก่น', 'อุบลราชธานี|อุบลราชธานี'], ['ธนบุรี|กรุงเทพมหานคร', 'น้ำตก|กาญจนบุรี'], ['พัทยา|ชลบุรี', 'หนองคาย|หนองคาย']];
function renderPlan() {
  const el = document.getElementById('result');
  if (!plan) {
    el.innerHTML = `<p class="hint">${esc(t('hintPlan'))}</p><div class="chips">${EXAMPLES.map((ex, i) => `<button class="chip" data-ex="${i}">${esc(nm(ST.get(ex[0])))} → ${esc(nm(ST.get(ex[1])))}</button>`).join('')}</div>`;
    el.querySelectorAll('[data-ex]').forEach(b => b.onclick = () => { const ex = EXAMPLES[+b.dataset.ex]; planFrom = ST.get(ex[0]); planTo = ST.get(ex[1]); computePlan(true); });
    return;
  }
  if (!plan.ok) { el.innerHTML = `<div class="result"><p class="note" style="margin:0">${esc(plan.msg)}</p><div class="row"><button class="btn" id="clr">${esc(t('clear'))}</button></div></div>`; document.getElementById('clr').onclick = clearPlan; return; }
  let h = `<div class="result"><div class="total"><b>${fmtKm(plan.km)}</b><span>${esc(t('km'))} · ${plan.stops} ${esc(t('stops'))} · ${esc(T[LANG].legsN(plan.legs.length))}</span></div><ul class="legs">`;
  plan.legs.forEach((L, i) => {
    if (i > 0) h += `<li class="xfer">${esc(t('change'))} <b>${esc(nm(L.from))}</b></li>`;
    h += `<li class="leg"><span class="bar" style="background:${LINES[L.line].color}"></span><span class="t">${esc(nm(L.from))} → ${esc(nm(L.to))}</span><span class="k">${fmtKm(L.km)} ${esc(t('km'))}</span><span class="m">${esc(lineName(L.line))} · ${L.n} ${esc(t('stations'))}</span></li>`;
  });
  h += `</ul>${plan.ferry ? `<p class="note" style="margin:0">⛴ ${esc(t('ferry'))}</p>` : ''}<div class="row"><button class="btn primary" id="zr">${esc(t('zoomRoute'))}</button><button class="btn" id="clr">${esc(t('clear'))}</button></div></div>`;
  el.innerHTML = h;
  document.getElementById('clr').onclick = clearPlan;
  document.getElementById('zr').onclick = () => { const pts = []; plan.legs.forEach(l => l.parts.forEach(p => pts.push(...p))); fitTo(bboxOf(pts), 70); collapseSheet(); };
}
function clearPlan() { planFrom = planTo = null; computePlan(); }

/* ---------- Station card ---------- */
function selectStation(s, fly) {
  selected = s; renderCard();
  if (fly) { const z = Math.max(cam.z, s.rank === 0 ? 6 : 10); flyTo(s.pos[0], s.pos[1] + (viewport().bottom / 2) / z, z); collapseSheet(); }
  redraw();
}
function renderCard() {
  const card = document.getElementById('card');
  const s = selected;
  if (!s) { card.hidden = true; return; }
  const d = fromBkk[s.id];
  const other = LANG === 'en' ? s.th : s.en;
  const tags = [...s.lines].map(l => `<span class="tag" style="border-color:${LINES[l].color};color:${LINES[l].color}">${esc(lineName(l))}</span>`).join('') + `<span class="tag plain">${esc(TYPES[s.type][LANG])}</span>`;
  let h = `<div class="hd"><div><h3>${esc(nm(s))}</h3><div class="alt">${esc(other)} · ${esc(t('province'))}${esc(provName(s))}</div></div><button class="x" id="cx" aria-label="${esc(t('close'))}">×</button></div><div class="tags">${tags}</div>`;
  h += `<div><div class="alt">${esc(t('fromBkk'))}</div><div class="big">${isFinite(d) ? `<b>${fmtKm(d)}</b><span>${esc(t('km'))}</span>` : `<span>${esc(t('notLinked'))}</span>`}</div></div>`;
  for (const e of s.on) {
    const R = e.R, p = R.sts[e.i - 1], n = R.sts[e.i + 1];
    const base = LANG === 'en' ? (BASE_EN[R.base] || R.base) : R.base;
    const nb = (x, lab) => x ? `<button data-go="${x.s.id}"><small>${esc(lab)} · ${fmtKm(Math.abs(x.km - e.km))} ${esc(t('km'))}</small>${esc(nm(x.s))}</button>` : `<button disabled><small>${esc(lab)}</small>—</button>`;
    h += `<div class="rt"><div class="rn"><span class="dot" style="background:${LINES[R.lines[0]].color}"></span>${esc(routeName(R))}</div><div class="km">${esc(t('kmPost'))} ${e.km.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} (${esc(t('ref'))} ${esc(base)})</div><div class="nb">${nb(p, t('prev'))}${nb(n, t('next'))}</div></div>`;
  }
  h += `<div class="row" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="sf">${esc(t('setFrom'))}</button><button class="btn" id="stt">${esc(t('setTo'))}</button></div>`;
  card.innerHTML = h; card.hidden = false;
  card.querySelector('#cx').onclick = () => { selected = null; renderCard(); redraw(); };
  card.querySelector('#sf').onclick = () => { planFrom = s; if (planTo === s) planTo = null; computePlan(!!planTo); };
  card.querySelector('#stt').onclick = () => { planTo = s; if (planFrom === s) planFrom = null; computePlan(!!planFrom); };
  card.querySelectorAll('[data-go]').forEach(b => b.onclick = () => selectStation(stations[+b.dataset.go], true));
}

/* ---------- Lines list, options, language ---------- */
function renderLines() {
  document.getElementById('lines').innerHTML = Object.keys(LINES).map(l => `<li><label><input type="checkbox" data-line="${l}" ${lineOn[l] ? 'checked' : ''}><span class="sw" style="background:${LINES[l].color}"></span><span class="nm">${esc(lineName(l))}</span><span class="st">${fmtKm(lineStats[l].km).replace(/[.,]\d$/, '')} ${esc(t('km'))} · ${lineStats[l].n} ${esc(t('stations'))}</span></label></li>`).join('');
  document.querySelectorAll('[data-line]').forEach(cb => cb.onchange = () => { lineOn[cb.dataset.line] = cb.checked; redraw(); });
}
document.getElementById('optH').onchange = e => { showH = e.target.checked; redraw(); };
document.getElementById('optF').onchange = e => { showF = e.target.checked; redraw(); };
document.getElementById('optD').onchange = e => { showD = e.target.checked; redraw(); };
function applyLang() {

  document.title = t('title');
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(el => el.placeholder = t(el.dataset.i18nPh));
  document.querySelectorAll('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', t(el.dataset.i18nAria)));
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === LANG)));
  document.getElementById('about').innerHTML = t('about').map(p => `<p>${esc(p)}</p>`).join('');
  qIn.value = selected ? nm(selected) : '';
  renderLines(); computePlan(false); renderCard(); redraw();
}
document.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => { LANG = b.dataset.lang; try { localStorage.setItem('thai-rail-lang', LANG); } catch (e) {} applyLang(); });

/* ---------- Mobile sheet ---------- */
const panel = document.getElementById('panel');
document.getElementById('handle').onclick = () => panel.classList.toggle('open');
function collapseSheet() { panel.classList.remove('open'); }
[qIn, fromIn, toIn].forEach(i => i.addEventListener('focus', () => { if (window.matchMedia('(max-width: 760px)').matches) panel.classList.add('open'); }));

/* ---------- Theme ---------- */
readColors();
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readColors(); redraw(); });
new MutationObserver(() => { readColors(); redraw(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

/* ---------- Start ---------- */
new ResizeObserver(() => { const first = !W; resize(); if (first) fitAll(false); }).observe(mapEl);
applyLang();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { mCache.clear(); redraw(); });
})();
